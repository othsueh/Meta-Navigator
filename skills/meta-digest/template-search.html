<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜尋特輯 · Meta Digest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    font-family: "Noto Serif TC", "Songti TC", Georgia, serif;
    overflow: hidden;
    background: #222;
  }

  #scene { display: block; width: 100vw; height: 100vh; }

  /* 聚落：可點擊、輕微起伏漂浮 */
  .cluster { cursor: pointer; }
  .cluster .bob {
    animation: bob 6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .cluster:hover .chip-bg { filter: brightness(1.06); }
  .cluster.active .select-ring { opacity: 1; }
  .select-ring {
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  /* ── 底欄（與 get_feed 面板同一套卡片語彙）──
     左側：主題說明；右側：貼文卡片，多的時候橫向捲動 */
  .sidebar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: min(320px, 52vh);
    background: #f6f2e9;
    color: #29251e;
    border-top: 2px solid #29251e;
    transform: translateY(108%);
    transition: transform 0.45s cubic-bezier(0.65, 0, 0.25, 1);
    display: flex;
    z-index: 10;
    box-shadow: 0 -12px 40px rgba(0,0,0,0.18);
  }
  .sidebar.open { transform: translateY(0); }

  .sidebar-head {
    flex: 0 0 300px;
    padding: 24px 28px;
    border-right: 2px solid #29251e;
    overflow-y: auto;
  }
  .sidebar-head .kicker {
    font-family: "Helvetica Neue", "PingFang TC", sans-serif;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .sidebar-head h2 {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.15;
  }
  .sidebar-head .lede {
    margin-top: 10px;
    font-family: "PingFang TC", sans-serif;
    font-size: 13.5px;
    line-height: 1.7;
    color: #58513f;
  }
  .sidebar .close {
    position: absolute;
    top: 14px; right: 16px;
    width: 32px; height: 32px;
    border: 1.5px solid #29251e;
    border-radius: 50%;
    background: #f6f2e9;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    color: #29251e;
    z-index: 1;
  }
  .cards {
    flex: 1;
    display: flex;
    align-items: stretch;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 22px 48px 22px 26px;
  }
  .card {
    flex: 0 0 290px;
    display: flex;
    flex-direction: column;
    padding: 2px 24px 2px 0;
    margin-right: 24px;
    border-right: 1px solid #d4ccba;
  }
  .card:last-child { border-right: none; }
  .card .no {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .card .body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .card .author {
    font-family: "PingFang TC", sans-serif;
    font-weight: 600;
    font-size: 14px;
  }
  .card .summary {
    margin-top: 5px;
    font-size: 14px;
    line-height: 1.65;
    flex: 1;
    overflow-y: auto;
  }
  .card .meta-row {
    margin-top: 10px;
    font-family: "Helvetica Neue", "PingFang TC", sans-serif;
    font-size: 12px;
    color: #8a8271;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: center;
  }
  .card a.src {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }
  .platform-tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid #b5ac99;
    border-radius: 3px;
    padding: 1px 6px;
  }
  .skipped-note {
    font-family: "PingFang TC", sans-serif;
    font-size: 14px;
    line-height: 1.8;
    color: #58513f;
    max-width: 36em;
    align-self: center;
  }

  /* 窄視窗：說明改到上方，卡片一樣橫向滑 */
  @media (max-width: 760px) {
    .sidebar {
      flex-direction: column;
      height: min(430px, 62vh);
    }
    .sidebar-head {
      flex: 0 0 auto;
      border-right: none;
      border-bottom: 2px solid #29251e;
      padding: 16px 20px 14px;
    }
    .sidebar-head h2 { font-size: 21px; padding-right: 40px; }
    .sidebar-head .lede { margin-top: 6px; }
    .cards { padding: 16px 20px; }
    .card { flex: 0 0 76vw; }
  }
</style>
</head>
<body>

<svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>

<aside class="sidebar" id="sidebar">
  <button class="close" id="sidebarClose">✕</button>
  <div class="sidebar-head">
    <div class="kicker" id="sbKicker"></div>
    <h2 id="sbTitle"></h2>
    <div class="lede" id="sbLede"></div>

<script>
/*
  ══ 替換點 1：SCENE + THEME —— 場景與配色，依搜尋關鍵字的意象訂定 ══
  - SCENE 一次只用一種："pond"（蓮花池）或 "meadow"（草原）。
    依關鍵字氛圍選：沉靜、思考型的主題適合 pond；
    熱鬧、生活感的主題適合 meadow。也可以輪替保持新鮮感。
  - THEME 顏色完全自由，不必符合真實自然色（水可以是暮紫、草可以是
    奶茶色），但必須遵守：
    1. 整體低刺激、不用螢光色——使用者的固定偏好。
    2. text 疊在 base 上必須清楚可讀（中央是關鍵字，最重要）。
    3. ink 是全圖描邊細線，選一個比 base 深很多的深色。
    4. accent 用在側欄的編號與連結，要在米白底上可讀（深色）。
  例：搜「爵士樂」→ 深夜藍水面、鎏金花瓣；
      搜「露營」→ 苔綠草地、暖橘小花。
*/
const SCENE = "pond"; // "pond" 或 "meadow"

const THEME = {
  name: "dusk-lotus",
  ink:    "#2c3a45",             // 全圖描邊
  base:   ["#8fb8c6", "#5f93a6"],// 水面/草地漸層（上→下）
  detail: "#c8e0e6",             // 水面光斑 / 草地紋理
  bloom:  ["#e8b9c8", "#f2d3da", "#d996ad"], // 花瓣用色（1~3 色）
  core:   "#f4e3ae",             // 花蕊
  pad:    ["#6f9d80", "#54826a"],// 蓮葉/植物的深淺綠
  text:   "#1e3038",             // 中央關鍵字
  label:  "#faf5e8",             // 主題標籤 chip 底色
  accent: "#8a4a5e",             // 側欄編號與連結（深、可讀）
};
/* meadow 範例主題（搜「露營」之類的生活題材時）：
   { name:"picnic-meadow", ink:"#3d3a2a", base:["#b6c48e","#8fa768"],
     detail:"#dde3b8", bloom:["#e9a87c","#f2d0a0","#d98a6a"], core:"#7a5a3a",
     pad:["#6f8a52","#566e3e"], text:"#33301f", label:"#faf5e4", accent:"#8a5a2f" } */

/*
  ══ 替換點 2：HERO —— 中央的關鍵字與 meta ══
  title 是搜尋關鍵字原文；meta 是日期 · search_posts · 平台 · 總篇數。
*/
const HERO = {
  title: "Claude Code",
  meta: "2026.07.04 · SEARCH_POSTS · THREADS + FACEBOOK + INSTAGRAM · 26 篇",
};

/*
  ══ 替換點 3：TOPICS + SKIPPED_NOTE —— 分區後的搜尋結果 ══
  - 依「切入角度」分 2~4 群（同一關鍵字下的不同子題），每群是
    池面上一叢聚攏的花與葉。
  - 每篇貼文自動變成一朵花或一片葉：讚數高（全體中位數以上）開花、
    讚數低是葉子；大小也依讚數縮放。不用自己標記。
  - lede 一句話講這群在聊什麼，會出現在側欄開頭。
  - SKIPPED_NOTE 沒有就設 null。
  - 以下為示意用的假資料。
*/
const TOPICS = [
  {
    title: "教學與入門資源",
    lede: "這個關鍵字下最多人分享的內容：入門教學與免費課程，討論度都很高。",
    posts: [
      { author: "@ai.truistic_（AI Truistic）", platform: "Threads",
        summary: "推薦 PAPAYA 的 27 分鐘 Claude Code 教學，從安裝到第一個專案，公認比官方文件好懂。",
        time: "3 月 24 日", likes: 5114, url: "https://www.threads.com/@ai.truistic_/post/xxxx" },
      { author: "@pan_0709（潘奕兆）", platform: "Threads",
        summary: "整理了一份免費的「Claude 入門全指南」，從訂閱方案選擇到常用指令都有。",
        time: "3 月 27 日", likes: 4516, url: "https://www.threads.com/@pan_0709/post/xxxx" },
      { author: "@lifegear.lab（生活裝備研究所）", platform: "Threads",
        summary: "Anthropic 自家的免費 AI 學校：20 多堂課、完課發證書，適合系統性補基礎。",
        time: "6 月 27 日", likes: 5066, url: "https://www.threads.com/@lifegear.lab/post/xxxx" },
    ],
  },
  {
    title: "實戰心得",
    lede: "真的拿它做出東西的人：一人公司上架 App、硬體電路板、瀏覽器遊戲。",
    posts: [
      { author: "@this.web（ThisWeb）", platform: "Threads",
        summary: "多數人用 Claude Code 沒有資料夾結構的概念，等於把它的手腳綁起來——附專案模板。",
        time: "4 月 13 日", likes: 7911, url: "https://www.threads.com/@this.web/post/xxxx" },
      { author: "@sofi.life_official（軟式生活）", platform: "Threads",
        summary: "兩個月燒了近 200 億 token 的心得：前兩週瞎跑，打掉重練後才找到正確工作流。",
        time: "7 月 1 日", likes: 3374, url: "https://www.threads.com/@sofi.life_official/post/xxxx" },
      { author: "鄭鴻旗（Facebook）", platform: "Facebook",
        summary: "讓 Claude Code 協助設計電路板，對它處理硬體細節的細緻程度印象深刻。",
        time: "7 月 1 日", likes: 388, url: "https://www.facebook.com/xxxx" },
      { author: "紀宏德（Facebook）", platform: "Facebook",
        summary: "非工程背景，用 Claude Code 做的記帳 App 上架 App Store，分享一人公司完整流程。",
        time: "7 月 1 日", likes: 203, url: "https://www.facebook.com/xxxx" },
    ],
  },
  {
    title: "產業動態與雜談",
    lede: "訂閱機制調整的討論還在延燒，加上幾篇輕鬆的段子。",
    posts: [
      { author: "@sevenlegstw（陳黑白）", platform: "Threads",
        summary: "設計師被男友洗腦學 vibe coding 的日常抱怨文，留言區很歡樂。",
        time: "5 月 27 日", likes: 5669, url: "https://www.threads.com/@sevenlegstw/post/xxxx" },
      { author: "侯智薰（Facebook）", platform: "Facebook",
        summary: "分析 Claude 訂閱機制調整：程式化用量將另計，重度使用者要重算成本。",
        time: "5 月 14 日", likes: 470, url: "https://www.facebook.com/xxxx" },
      { author: "@jerry.oops（Threads）", platform: "Threads",
        summary: "IC 設計圈的視角：公司禁用雲端 AI 寫 RTL，討論本地部署的可行性。",
        time: "7 月 2 日", likes: 324, url: "https://www.threads.com/@jerry.oops/post/xxxx" },
    ],
  },
];

const SKIPPED_NOTE =
  "另有 6 篇已略過：4 篇內容重複的轉發、2 篇掛關鍵字的課程廣告。本頁由 search_posts 產生，依關鍵字相關度分群；判斷有誤的話告訴我，我會記住。";

/* ════════════ 以下為渲染邏輯，照用不要改 ════════════ */

document.documentElement.style.setProperty("--accent", THEME.accent);
document.title = `${HERO.title} · 搜尋特輯`;

// ── 安全性 helper（不要動）── 貼文內容是陌生人公開貼文抓來的不可信資料，
// 插進 HTML 前用 esc() 逸出、網址用 safeUrl() 過濾協定，擋掉 <img onerror>
// 與 javascript: 連結這類藏在 caption 裡的注入。
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}
function safeUrl(v) {
  const s = String(v ?? "").trim();
  return /^https?:\/\//i.test(s) ? esc(s) : "#";
}

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("scene");

function el(name, attrs = {}, parent) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}
// 可重現的偽隨機（每次 render 佈局一致）
function rng(seed) {
  let t = seed;
  return () => {
    t += 0x6d2b79f5;
    let r = Math.imul(t ^ (t >>> 15), t | 1);
    r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── 元素繪製：全部帶 ink 細描邊（插畫風的關鍵）── */

// 蓮葉：帶缺口的圓葉 + 放射葉脈
function drawPad(parent, r, rand) {
  const g = el("g", {}, parent);
  const ry = r * 0.86;
  const notch = rand() * Math.PI * 2;
  const a1 = notch + 0.42, a2 = notch - 0.42 + Math.PI * 2;
  const px = (a) => (r * Math.cos(a)).toFixed(1);
  const py = (a) => (ry * Math.sin(a)).toFixed(1);
  el("ellipse", { cx: 0, cy: ry * 0.28, rx: r * 0.95, ry: ry * 0.5,
    fill: THEME.ink, opacity: 0.14 }, g);
  const fill = THEME.pad[Math.floor(rand() * THEME.pad.length)];
  el("path", {
    d: `M 0 0 L ${px(a1)} ${py(a1)} A ${r} ${ry} 0 1 1 ${px(a2)} ${py(a2)} Z`,
    fill, stroke: THEME.ink, "stroke-width": 1.6, "stroke-linejoin": "round",
  }, g);
  for (let k = 1; k <= 5; k++) {
    const a = a1 + ((a2 - a1) * k) / 6;
    el("line", { x1: 0, y1: 0, x2: px(a) * 0.78, y2: py(a) * 0.78,
      stroke: THEME.ink, "stroke-width": 0.9, opacity: 0.35 }, g);
  }
  el("ellipse", { cx: -r * 0.3, cy: -ry * 0.34, rx: r * 0.22, ry: ry * 0.1,
    fill: "#ffffff", opacity: 0.22 }, g);
  return g;
}

// 蓮花：兩層花瓣 + 花蕊（俯視微傾）
function drawLotus(parent, r, rand) {
  const g = el("g", {}, parent);
  el("ellipse", { cx: 0, cy: r * 0.5, rx: r * 0.85, ry: r * 0.3,
    fill: THEME.ink, opacity: 0.15 }, g);
  const squash = el("g", { transform: "scale(1 0.88)" }, g);
  const petal = (dist, len, wid, angle, fill) => {
    const deg = (angle * 180) / Math.PI;
    el("ellipse", {
      cx: 0, cy: 0, rx: len, ry: wid, fill,
      stroke: THEME.ink, "stroke-width": 1.3,
      transform: `rotate(${deg.toFixed(1)}) translate(${dist} 0)`,
    }, squash);
  };
  const base = Math.floor(rand() * THEME.bloom.length);
  const c1 = THEME.bloom[base % THEME.bloom.length];
  const c2 = THEME.bloom[(base + 1) % THEME.bloom.length];
  const spin = rand() * Math.PI;
  for (let k = 0; k < 8; k++) petal(r * 0.56, r * 0.46, r * 0.21, spin + (k * Math.PI * 2) / 8, c1);
  for (let k = 0; k < 5; k++) petal(r * 0.3, r * 0.34, r * 0.18, spin + 0.35 + (k * Math.PI * 2) / 5, c2);
  el("circle", { cx: 0, cy: 0, r: r * 0.17, fill: THEME.core,
    stroke: THEME.ink, "stroke-width": 1.2 }, squash);
  for (let k = 0; k < 6; k++) {
    const a = (k * Math.PI * 2) / 6;
    el("circle", { cx: Math.cos(a) * r * 0.09, cy: Math.sin(a) * r * 0.09,
      r: r * 0.02 + 0.6, fill: THEME.ink, opacity: 0.55 }, squash);
  }
  return g;
}

// 草原小花：圓瓣雛菊
function drawFlower(parent, r, rand) {
  const g = el("g", {}, parent);
  el("ellipse", { cx: 0, cy: r * 0.55, rx: r * 0.8, ry: r * 0.28,
    fill: THEME.ink, opacity: 0.13 }, g);
  const fill = THEME.bloom[Math.floor(rand() * THEME.bloom.length)];
  const n = 6 + Math.floor(rand() * 2);
  const spin = rand() * Math.PI;
  for (let k = 0; k < n; k++) {
    const a = spin + (k * Math.PI * 2) / n;
    el("circle", { cx: Math.cos(a) * r * 0.52, cy: Math.sin(a) * r * 0.47,
      r: r * 0.34, fill, stroke: THEME.ink, "stroke-width": 1.3 }, g);
  }
  el("circle", { cx: 0, cy: 0, r: r * 0.26, fill: THEME.core,
    stroke: THEME.ink, "stroke-width": 1.2 }, g);
  return g;
}

// 草原植物：一撮彎垂的草葉
function drawTuft(parent, r, rand) {
  const g = el("g", {}, parent);
  el("ellipse", { cx: 0, cy: r * 0.1, rx: r * 0.7, ry: r * 0.2,
    fill: THEME.ink, opacity: 0.12 }, g);
  const n = 5 + Math.floor(rand() * 2);
  for (let k = 0; k < n; k++) {
    const lean = (k / (n - 1) - 0.5) * r * 1.7 + (rand() - 0.5) * r * 0.3;
    const h = r * (1.35 + rand() * 0.6);
    const fill = THEME.pad[Math.floor(rand() * THEME.pad.length)];
    el("path", {
      d: `M ${-r * 0.11} 0 Q ${lean * 0.3} ${-h * 0.55} ${lean} ${-h}` +
         ` Q ${lean * 0.55 + r * 0.11} ${-h * 0.5} ${r * 0.11} 0 Z`,
      fill, stroke: THEME.ink, "stroke-width": 1.2, "stroke-linejoin": "round",
    }, g);
  }
  return g;
}

/* ── 場景 ── */

function render() {
  svg.innerHTML = "";
  const portrait = window.innerHeight > window.innerWidth * 1.05;
  const W = portrait ? 740 : 1240;
  const H = portrait ? 1200 : 780;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  const cx = W / 2, cy = H / 2;
  const rand = rng(7);

  // slice 會裁掉超出視窗比例的部分，算出實際可視範圍（貼邊元素要用它定位）
  const cw = svg.clientWidth || W, ch = svg.clientHeight || H;
  const zoom = Math.max(cw / W, ch / H);
  const visX = (W - cw / zoom) / 2;
  const visY = (H - ch / zoom) / 2;
  const visW = cw / zoom;

  // 底：水面/草地漸層
  const defs = el("defs", {}, svg);
  const grad = el("linearGradient", { id: "base", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": THEME.base[0] }, grad);
  el("stop", { offset: "100%", "stop-color": THEME.base[1] }, grad);
  el("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#base)" }, svg);

  // 底面紋理：水的光斑橢圓 / 草的短撇與小點（避開中央文字區）
  const inCenter = (x, y) =>
    Math.hypot((x - cx) / (W * 0.24), (y - cy) / (H * 0.17)) < 1;
  for (let i = 0; i < 46; i++) {
    const x = rand() * W, y = rand() * H;
    if (inCenter(x, y)) continue;
    if (SCENE === "pond") {
      const w = 14 + rand() * 40;
      el("ellipse", { cx: x, cy: y, rx: w, ry: w * 0.16,
        fill: THEME.detail, opacity: 0.25 + rand() * 0.3,
        stroke: rand() > 0.72 ? THEME.ink : "none",
        "stroke-width": 0.8, "stroke-opacity": 0.25 }, svg);
    } else {
      if (rand() > 0.45) {
        const h = 7 + rand() * 12, lean = (rand() - 0.5) * 8;
        el("path", { d: `M ${x} ${y} Q ${x + lean} ${y - h * 0.6} ${x + lean * 1.6} ${y - h}`,
          fill: "none", stroke: THEME.detail, "stroke-width": 1.4,
          opacity: 0.5, "stroke-linecap": "round" }, svg);
      } else {
        el("circle", { cx: x, cy: y, r: 1.3 + rand() * 1.8,
          fill: THEME.detail, opacity: 0.5 }, svg);
      }
    }
  }

  // 中央：一圈圈漣漪/淺色空地 + 關鍵字 + meta
  const est = [...HERO.title].reduce((s, ch) => s + (ch.charCodeAt(0) > 255 ? 1 : 0.56), 0);
  const fs = Math.min(portrait ? 64 : 88, (W * 0.62) / Math.max(est, 3));
  const haloRx = Math.max((est * fs) / 2 + 70, W * 0.2);
  const haloRy = haloRx * 0.42;
  if (SCENE === "pond") {
    for (let k = 3; k >= 1; k--) {
      el("ellipse", { cx, cy, rx: haloRx * (0.68 + k * 0.22), ry: haloRy * (0.68 + k * 0.22),
        fill: "none", stroke: THEME.detail, "stroke-width": 1.4,
        opacity: 0.55 - k * 0.12 }, svg);
    }
    el("ellipse", { cx, cy, rx: haloRx * 0.78, ry: haloRy * 0.78,
      fill: THEME.detail, opacity: 0.18 }, svg);
  } else {
    el("ellipse", { cx, cy, rx: haloRx * 0.95, ry: haloRy * 0.95,
      fill: THEME.detail, opacity: 0.22,
      stroke: THEME.ink, "stroke-width": 1.2, "stroke-opacity": 0.2,
      "stroke-dasharray": "3 7" }, svg);
  }
  el("text", { x: cx, y: cy - fs * 0.08, "text-anchor": "middle",
    "font-size": fs, "font-weight": 900, fill: THEME.text,
    "font-family": '"Noto Serif TC","Songti TC",Georgia,serif' }, svg,
  ).textContent = HERO.title;
  // meta 太長塞不進可視寬度時，從中間的「·」拆成兩行
  const metaFs = portrait ? 11.5 : 13;
  const metaW = HERO.meta.length * metaFs * 0.92;
  let metaLines = [HERO.meta];
  if (metaW > visW * 0.86) {
    const parts = HERO.meta.split("·");
    const half = Math.ceil(parts.length / 2);
    metaLines = [
      parts.slice(0, half).join("·").trim(),
      parts.slice(half).join("·").trim(),
    ];
  }
  const metaText = el("text", { x: cx, y: cy + fs * 0.62, "text-anchor": "middle",
    "font-size": metaFs, "letter-spacing": "0.18em", fill: THEME.text,
    opacity: 0.72,
    "font-family": '"Helvetica Neue","PingFang TC",sans-serif' }, svg);
  metaLines.forEach((line, k) => {
    el("tspan", { x: cx, dy: k === 0 ? 0 : metaFs * 1.7 }, metaText).textContent = line;
  });

  // 讚數 → 尺寸/花或葉 的全域比例尺
  const allLikes = TOPICS.flatMap((t) => t.posts.map((p) => p.likes));
  const sorted = [...allLikes].sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)] ?? 0;
  const lo = Math.sqrt(sorted[0] ?? 0), hi = Math.sqrt(sorted[sorted.length - 1] ?? 1);
  const scale = (likes, min, max) =>
    hi === lo ? (min + max) / 2 : min + ((Math.sqrt(likes) - lo) / (hi - lo)) * (max - min);

  // 聚落位置：繞中心的橢圓軌道均分
  const RX = portrait ? W * 0.27 : W * 0.31;
  const RY = portrait ? H * 0.32 : H * 0.28;
  const startA = portrait ? -Math.PI / 2 : -Math.PI / 2 - 0.5;

  TOPICS.forEach((topic, i) => {
    const a = startA + (i * Math.PI * 2) / TOPICS.length;
    const gx = cx + Math.cos(a) * RX;
    const gy = cy + Math.sin(a) * RY;
    const trand = rng(31 + i * 97);

    const cluster = el("g", { class: "cluster" }, svg);
    const bob = el("g", { class: "bob", style: `animation-delay:${-i * 1.7}s` }, cluster);
    const inner = el("g", { transform: `translate(${gx.toFixed(1)} ${gy.toFixed(1)})` }, bob);

    // 依讚數排：最大的放叢中心，其餘沿黃金角螺旋散開
    const posts = [...topic.posts].sort((p, q) => q.likes - p.likes);
    let maxR = 0;
    let maxY = 0;
    posts.forEach((p, k) => {
      const isBloom = p.likes >= median;
      const r = isBloom ? scale(p.likes, 26, 46) : scale(p.likes, 18, 34);
      const dist = k === 0 ? 0 : 42 + 30 * Math.sqrt(k) + trand() * 10;
      const ang = trand() * Math.PI * 2 + k * 2.4;
      const x = Math.cos(ang) * dist;
      const y = Math.sin(ang) * dist * 0.78;
      maxR = Math.max(maxR, Math.hypot(x, y) + r);
      maxY = Math.max(maxY, y + r);
      const item = el("g", { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)})` }, inner);
      if (SCENE === "pond") (isBloom ? drawLotus : drawPad)(item, r, trand);
      else (isBloom ? drawFlower : drawTuft)(item, r, trand);
    });

    // 選取圈（點開側欄時亮起）
    el("ellipse", { class: "select-ring", cx: 0, cy: 0,
      rx: maxR + 16, ry: (maxR + 16) * 0.8,
      fill: "none", stroke: THEME.label, "stroke-width": 2,
      "stroke-dasharray": "2 8", "stroke-linecap": "round" }, inner);

    // 標籤 chip：貼著聚落最低點掛在下方
    const label = `${topic.title} · ${topic.posts.length}`;
    const lw = [...label].reduce((s, ch) => s + (ch.charCodeAt(0) > 255 ? 13 : 7.4), 0) + 30;
    const ly = maxY + 18;
    el("rect", { class: "chip-bg", x: -lw / 2, y: ly, width: lw, height: 26,
      rx: 13, fill: THEME.label, stroke: THEME.ink, "stroke-width": 1.4 }, inner);
    el("text", { x: 0, y: ly + 17.5, "text-anchor": "middle", "font-size": 13,
      fill: THEME.ink, "font-weight": 600,
      "font-family": '"PingFang TC","Helvetica Neue",sans-serif' }, inner,
    ).textContent = label;

    cluster.addEventListener("click", (e) => {
      e.stopPropagation();
      openSidebar(topic, i);
      document.querySelectorAll(".cluster.active").forEach((c) => c.classList.remove("active"));
      cluster.classList.add("active");
    });
  });

  // 已略過：角落一枚安靜的小 chip（用可視範圍定位，避免被 slice 裁掉）
  if (SKIPPED_NOTE) {
    const pad = 22;
    const label = "已略過 ⋯";
    const lw = 96;
    const g = el("g", { class: "cluster",
      transform: `translate(${visX + pad + lw / 2} ${H - visY - pad - 14})` }, svg);
    el("rect", { class: "chip-bg", x: -lw / 2, y: -13, width: lw, height: 26, rx: 13,
      fill: THEME.label, opacity: 0.85, stroke: THEME.ink, "stroke-width": 1.2 }, g);
    el("text", { x: 0, y: 4.5, "text-anchor": "middle", "font-size": 12.5,
      fill: THEME.ink, "font-weight": 600,
      "font-family": '"PingFang TC",sans-serif' }, g).textContent = label;
    g.addEventListener("click", (e) => {
      e.stopPropagation();
      openSidebar({ title: "已略過", lede: null, posts: [], skipped: true }, -1);
    });
  }
}

/* ── 側邊欄 ── */
const sidebar = document.getElementById("sidebar");

function openSidebar(topic, idx) {
  document.getElementById("sbKicker").textContent =
    topic.skipped ? "低價值內容" : `主題 ${String(idx + 1).padStart(2, "0")}`;
  document.getElementById("sbTitle").textContent = topic.title;
  document.getElementById("sbLede").textContent = topic.lede ?? "";
  const cards = document.getElementById("sbCards");
  if (topic.skipped) {
    cards.innerHTML = `<p class="skipped-note">${esc(SKIPPED_NOTE)}</p>`;
  } else {
    const posts = [...topic.posts].sort((p, q) => q.likes - p.likes);
    cards.innerHTML = posts.map((p, j) => `
      <article class="card">
        <span class="no">${String(j + 1).padStart(2, "0")}</span>
        <div class="body">
          <div class="author">${esc(p.author)}</div>
          <div class="summary">${esc(p.summary)}</div>
          <div class="meta-row">
            <span class="platform-tag">${esc(p.platform)}</span>
            <span>${esc(p.time)}</span>
            <span>♥ ${p.likes.toLocaleString()}</span>
            <a class="src" href="${safeUrl(p.url)}" target="_blank" rel="noopener">開啟原文 ↗</a>
          </div>
        </div>
      </article>`).join("");
  }
  cards.scrollTop = 0;
  sidebar.classList.add("open");
}
function closeSidebar() {
  sidebar.classList.remove("open");
  document.querySelectorAll(".cluster.active").forEach((c) => c.classList.remove("active"));
}
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
svg.addEventListener("click", closeSidebar);

// 滾輪直向捲動轉成卡片的橫向捲動
document.getElementById("sbCards").addEventListener("wheel", (e) => {
  const cards = e.currentTarget;
  if (cards.scrollWidth <= cards.clientWidth) return;
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    cards.scrollLeft += e.deltaY;
  }
}, { passive: false });

render();
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 200);
});
</script>

</body>
